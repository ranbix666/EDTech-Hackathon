<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>prober.ai — Enter API Key</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="particles"></div>

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="/icon.jpg" alt="prober.ai logo" class="login-logo-img" id="login-logo-img" />
        <span class="login-brand">prober.ai</span>
      </div>

      <div class="login-header">
        <h1 class="login-title">👋 Welcome to Prober.ai!</h1>
        <p class="login-subtitle">
          To get started, enter your <strong>Google Gemini API key</strong>. It stays in your browser and is sent directly to the AI — never stored on our servers.
        </p>
      </div>

      <div class="login-form">
        <div class="login-input-wrap">
          <input
            type="password"
            id="api-key-input"
            class="login-input"
            placeholder="AIza..."
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="button"
            class="login-eye-btn"
            id="toggle-visibility"
            aria-label="Toggle key visibility"
          >
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>

        <p class="login-error" id="login-error" aria-live="polite"></p>

        <button type="button" class="login-submit button" id="login-btn">
          <span class="btn-text">Enter</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <div class="login-help">
        <i class="fa-solid fa-circle-info"></i>
        Don't have a key?
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">
          Get one free at Google AI Studio
        </a>
        — no credit card required.
      </div>
    </div>
  </div>

  <script>
    // Particle background
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 150 + 150;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.animationDuration = `${Math.random() * 20 + 20}s`;
      p.style.animationDelay = `${Math.random() * 15}s`;
      particlesContainer.appendChild(p);
    }

    const input = document.getElementById('api-key-input');
    const loginBtn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    const toggleVisBtn = document.getElementById('toggle-visibility');
    const eyeIcon = document.getElementById('eye-icon');
    const logoImg = document.getElementById('login-logo-img');

    // If already have a key, skip straight to home
    if (localStorage.getItem('geminiApiKey')) {
      window.location.replace('/');
    }

    // Apply saved theme
    const savedTheme = localStorage.getItem('proberHomeTheme') || 'orange';
    if (savedTheme !== 'orange') {
      document.body.classList.add('theme-unc');
      if (logoImg) logoImg.src = '/iconBlue.jpg';
    } else {
      document.body.classList.add('theme-orange');
    }

    toggleVisBtn.addEventListener('click', () => {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    function showError(msg) {
      errorEl.textContent = msg;
      input.classList.add('login-input-error');
    }

    function clearError() {
      errorEl.textContent = '';
      input.classList.remove('login-input-error');
    }

    input.addEventListener('input', clearError);

    function handleSubmit() {
      const key = input.value.trim();
      if (!key) {
        showError('Please enter your Gemini API key.');
        input.focus();
        return;
      }
      if (!key.startsWith('AIza')) {
        showError('That doesn\'t look like a valid Gemini API key (should start with "AIza").');
        input.focus();
        return;
      }
      localStorage.setItem('geminiApiKey', key);
      window.location.replace('/');
    }

    loginBtn.addEventListener('click', handleSubmit);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>
